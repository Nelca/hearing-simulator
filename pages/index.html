<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>模擬ヒアリング</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #eef1f5;
      --text: #1b2430;
      --muted: #5b6776;
      --line: #d9dfe7;
      --accent: #1f6feb;
      --accent-text: #ffffff;
      --user-bg: #1f6feb;
      --user-text: #ffffff;
      --warn-bg: #fff4d6;
      --warn-text: #6b4b00;
      --danger-bg: #fde8e8;
      --danger-text: #8a1c1c;
      --ok-bg: #e3f5e9;
      --ok-text: #14532d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f141a;
        --surface: #18202a;
        --surface-2: #212b37;
        --text: #e8edf3;
        --muted: #9aa7b6;
        --line: #2c3745;
        --accent: #5aa2ff;
        --accent-text: #08111c;
        --user-bg: #2a5fb8;
        --user-text: #ffffff;
        --warn-bg: #3a2f10;
        --warn-text: #ffdf8a;
        --danger-bg: #3d1c1c;
        --danger-text: #ffb4b4;
        --ok-bg: #12301f;
        --ok-text: #a8e6bd;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
      display: flex;
      flex-direction: column;
    }
    [hidden] { display: none !important; }
    button, input, textarea { font: inherit; color: inherit; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    header.top {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line);
    }
    header.top h1 { margin: 0; font-size: 17px; letter-spacing: .02em; }
    .who { color: var(--muted); font-size: 14px; }
    .who b { color: var(--text); font-weight: 600; }

    .notice {
      margin: 0; padding: 8px 20px; font-size: 13px; color: var(--muted);
      background: var(--surface); border-top: 1px solid var(--line);
    }

    /* ---- ログイン ---- */
    .login-wrap { flex: 1; display: grid; place-items: center; padding: 24px 16px; }
    .card {
      width: min(440px, 100%); background: var(--surface); border: 1px solid var(--line);
      border-radius: 14px; padding: 28px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .card h2 { margin: 0 0 4px; font-size: 20px; }
    .card p.lead { margin: 0 0 20px; color: var(--muted); }
    label { display: block; margin: 14px 0 4px; font-weight: 600; font-size: 14px; }
    .field {
      width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--bg);
    }
    .field:focus { border-color: var(--accent); }
    .btn {
      appearance: none; border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
      padding: 9px 14px; border-radius: 8px; cursor: pointer; font-weight: 600;
    }
    .btn:hover:not(:disabled) { filter: brightness(0.97); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    .btn.block { width: 100%; margin-top: 20px; padding: 11px 14px; }
    .privacy {
      margin-top: 18px; padding: 10px 12px; background: var(--warn-bg); color: var(--warn-text);
      border-radius: 8px; font-size: 13px;
    }
    .form-error { margin-top: 12px; color: var(--danger-text); background: var(--danger-bg); padding: 8px 12px; border-radius: 8px; font-size: 14px; }

    /* ---- チャット ---- */
    .app { flex: 1; min-height: 0; display: grid; grid-template-columns: 250px 1fr; }
    aside.side {
      background: var(--surface); border-right: 1px solid var(--line); padding: 16px;
      display: flex; flex-direction: column; gap: 14px; overflow-y: auto;
    }
    aside.side h2 { margin: 0; font-size: 13px; color: var(--muted); font-weight: 600; }
    .personas { display: flex; flex-direction: column; gap: 8px; }
    .persona-btn {
      text-align: left; width: 100%; padding: 10px 12px; border-radius: 10px; cursor: pointer;
      border: 1px solid var(--line); background: var(--bg);
    }
    .persona-btn .name { display: block; font-weight: 600; }
    .persona-btn .desc { display: block; font-size: 12px; color: var(--muted); }
    .persona-btn[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--surface); }
    .persona-btn:disabled { cursor: not-allowed; opacity: .6; }
    .remaining { font-size: 14px; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); }
    .remaining.low { background: var(--warn-bg); color: var(--warn-text); }
    .remaining.none { background: var(--danger-bg); color: var(--danger-text); }
    .side-actions { display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
    .side-actions a.btn { text-decoration: none; text-align: center; }
    .side-actions a.btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }

    main.chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    /* ---- 相手（話している様子を見せる） / The persona, shown as someone who is talking ---- */
    .stage {
      display: flex; align-items: center; gap: 16px;
      padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--surface);
    }
    .stage-avatar { position: relative; width: 76px; height: 76px; flex: none; border-radius: 50%; transition: box-shadow .2s; }
    .stage-avatar::after {
      content: ""; position: absolute; inset: 0; border-radius: 50%;
      border: 3px solid var(--accent); opacity: 0; pointer-events: none;
    }
    .stage[data-state="speaking"] .stage-avatar { box-shadow: 0 0 0 3px var(--accent); }
    .stage[data-state="speaking"] .stage-avatar::after { animation: ring 1.5s ease-out infinite; }
    .stage[data-state="thinking"] .stage-avatar { box-shadow: 0 0 0 3px var(--line); }
    @keyframes ring { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(1.22); opacity: 0; } }
    .stage-info { flex: 1; min-width: 0; }
    .stage-info .name { font-weight: 700; font-size: 17px; }
    .stage-info .desc { color: var(--muted); font-size: 13px; }
    .status { display: flex; align-items: center; gap: 6px; margin-top: 4px; min-height: 20px; font-size: 13px; color: var(--muted); }
    .stage[data-state="speaking"] .status { color: var(--accent); font-weight: 600; }
    .status .wave, .status .typing { display: none; }
    .stage[data-state="speaking"] .status .wave { display: inline-flex; }
    .stage[data-state="thinking"] .status .typing { display: inline-flex; }
    .wave { align-items: center; gap: 2px; height: 14px; }
    .wave i { width: 3px; height: 100%; border-radius: 2px; background: currentColor; transform: scaleY(.35); animation: wave .9s ease-in-out infinite; }
    .wave i:nth-child(2) { animation-delay: .15s; }
    .wave i:nth-child(3) { animation-delay: .3s; }
    .wave i:nth-child(4) { animation-delay: .45s; }
    @keyframes wave { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
    .voice-btn { display: inline-flex; align-items: center; gap: 6px; flex: none; padding: 7px 11px; font-size: 13px; }
    .voice-btn svg { width: 16px; height: 16px; }
    .voice-btn .on { display: none; }
    .voice-btn[aria-pressed="true"] { background: var(--ok-bg); color: var(--ok-text); border-color: transparent; }
    .voice-btn[aria-pressed="true"] .on { display: inline; }
    .voice-btn[aria-pressed="true"] .off { display: none; }

    /* 似顔絵: 口・まばたき・考えているときの目線 / Portrait: mouth, blinking, eyes while thinking */
    .avatar svg { display: block; width: 100%; height: 100%; border-radius: 50%; }
    .avatar .mouth-open { display: none; }
    .avatar.talking .mouth-closed { display: none; }
    .avatar.talking .mouth-open { display: inline; transform-box: fill-box; transform-origin: center; animation: talk .2s ease-in-out infinite alternate; }
    @keyframes talk { from { transform: scaleY(.3); } to { transform: scaleY(1); } }
    .avatar .eyes { transform-box: fill-box; transform-origin: center; animation: eye-blink 5s infinite; }
    @keyframes eye-blink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
    .avatar .gaze { transition: transform .3s; }
    .avatar.thinking .gaze { transform: translate(1.6px, -2px); }
    .banner { margin: 0; padding: 10px 20px; font-size: 14px; }
    .banner.error { background: var(--danger-bg); color: var(--danger-text); }
    .banner.info { background: var(--ok-bg); color: var(--ok-text); }

    .log { flex: 1; min-height: 0; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .empty { margin: auto; max-width: 420px; text-align: center; color: var(--muted); }
    .msg { max-width: min(720px, 88%); display: flex; align-items: flex-start; gap: 10px; }
    .msg-avatar { width: 38px; height: 38px; flex: none; margin-top: 18px; }
    .msg-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .msg .who-label { font-size: 12px; color: var(--muted); }
    .msg .bubble {
      position: relative; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere;
      background: var(--surface); border: 1px solid var(--line);
    }
    /* 相手の吹き出しのしっぽ / Speech-bubble tail for the persona */
    .msg.assistant .bubble::before {
      content: ""; position: absolute; left: -6px; top: 13px; width: 10px; height: 10px;
      background: var(--surface); border-left: 1px solid var(--line); border-bottom: 1px solid var(--line);
      transform: rotate(45deg);
    }
    /* 話している途中のカーソル / Cursor while the persona is still talking */
    .bubble.live::after {
      content: ""; display: inline-block; width: 2px; height: 1.05em; margin-left: 2px; vertical-align: -0.18em;
      background: currentColor; animation: caret 1s steps(1) infinite;
    }
    @keyframes caret { 50% { opacity: 0; } }
    .msg.user { align-self: flex-end; }
    .msg.user .msg-body { align-items: flex-end; }
    .msg.user .bubble { background: var(--user-bg); border-color: var(--user-bg); color: var(--user-text); border-top-right-radius: 4px; }
    .typing { display: inline-flex; gap: 4px; align-items: center; height: 1.4em; }
    .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite ease-in-out; }
    .typing i:nth-child(2) { animation-delay: .2s; }
    .typing i:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .typing i { animation: none; opacity: .6; }
      .wave i, .avatar .eyes, .avatar.talking .mouth-open, .stage-avatar::after, .bubble.live::after { animation: none; }
      .wave i { transform: scaleY(.7); }
    }

    form.composer { display: flex; gap: 10px; align-items: flex-end; padding: 12px 20px 8px; background: var(--surface); border-top: 1px solid var(--line); }
    .composer textarea { flex: 1; resize: none; min-height: 46px; max-height: 160px; }
    .counter { font-size: 12px; color: var(--muted); text-align: right; padding: 0 20px 8px; background: var(--surface); }
    .composer-wrap { background: var(--surface); }
    .counter.over { color: var(--danger-text); font-weight: 700; }

    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      aside.side { border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 12px; gap: 8px; }
      aside.side h2 { display: none; }
      .personas { flex-direction: row; flex: 1 1 100%; }
      .persona-btn { padding: 8px 10px; }
      .persona-btn .desc { display: none; }
      .side-actions { flex-direction: row; margin: 0; }
      .msg { max-width: 96%; gap: 8px; }
      .msg-avatar { width: 32px; height: 32px; }
      header.top { padding: 10px 12px; }
      .stage { gap: 12px; padding: 10px 12px; }
      .stage-avatar { width: 56px; height: 56px; }
      .stage-info .name { font-size: 16px; }
      .stage-info .desc { font-size: 12px; }
      .log, .banner { padding-left: 12px; padding-right: 12px; }
      form.composer { padding-left: 12px; padding-right: 12px; }
      .counter { padding-right: 12px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <h1>模擬ヒアリング</h1>
    <div class="who" id="who" hidden>名前：<b id="who-name"></b></div>
  </header>

  <!-- 最初の画面: 合言葉と名前 -->
  <section class="login-wrap" id="login-view" hidden>
    <form class="card" id="login-form" autocomplete="off">
      <h2>はじめに</h2>
      <p class="lead">講師から伝えられた合言葉と、あなたの名前を入力してください。</p>
      <label for="code">合言葉</label>
      <input class="field" id="code" type="password" required autocomplete="off" spellcheck="false">
      <label for="name">名前（ログの区別にだけ使います）</label>
      <input class="field" id="name" type="text" required maxlength="30" autocomplete="off" placeholder="例：田中">
      <p class="privacy">入力した内容は講師が確認します。個人情報や社外秘の情報は入力しないでください。</p>
      <div class="form-error" id="login-error" role="alert" hidden></div>
      <button class="btn primary block" id="login-submit" type="submit">はじめる</button>
    </form>
  </section>

  <!-- チャット画面 -->
  <div class="app" id="app-view" hidden>
    <aside class="side">
      <h2 id="persona-heading">相手を選ぶ</h2>
      <div class="personas" id="personas" role="tablist" aria-labelledby="persona-heading"></div>
      <div class="remaining" id="remaining" aria-live="polite"></div>
      <div class="side-actions">
        <button class="btn" id="reset-btn" type="button">やり直す</button>
        <a class="btn" id="export-btn" href="#" download>会話を保存</a>
      </div>
    </aside>

    <main class="chat">
      <div class="stage" id="stage" data-state="idle">
        <div class="stage-avatar avatar" id="stage-avatar" aria-hidden="true"></div>
        <div class="stage-info">
          <div class="name" id="chat-name"></div>
          <div class="desc" id="chat-desc"></div>
          <div class="status">
            <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span class="typing" aria-hidden="true"><i></i><i></i><i></i></span>
            <span id="stage-status">あなたの質問を待っています</span>
          </div>
        </div>
        <button class="btn voice-btn" id="voice-btn" type="button" aria-pressed="false" hidden
                title="返答をブラウザの読み上げ機能で声に出します（音が出ます）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 5 6 9H3v6h3l5 4z"/>
            <path class="on" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>
            <path class="off" d="m16 9 6 6m0-6-6 6"/>
          </svg>
          <span>読み上げ</span>
        </button>
      </div>
      <p class="banner error" id="banner" role="alert" hidden></p>
      <div class="log" id="log" role="log" aria-live="polite" aria-label="会話"></div>
      <div class="composer-wrap">
        <form class="composer" id="composer">
          <textarea class="field" id="input" rows="2" aria-label="質問を入力" placeholder="質問を入力（Enterで送信、Shift+Enterで改行）"></textarea>
          <button class="btn primary" id="send" type="submit">送信</button>
        </form>
        <div class="counter" id="counter" aria-hidden="true"></div>
      </div>
    </main>
  </div>

  <p class="notice">※ 入力した内容は講師が確認します。個人情報や社外秘は入力しないでください。</p>

  <script>
    "use strict";

    const $ = (id) => document.getElementById(id);
    const els = {
      loginView: $("login-view"), appView: $("app-view"), who: $("who"), whoName: $("who-name"),
      loginForm: $("login-form"), code: $("code"), name: $("name"), loginError: $("login-error"), loginSubmit: $("login-submit"),
      personas: $("personas"), remaining: $("remaining"), resetBtn: $("reset-btn"), exportBtn: $("export-btn"),
      chatName: $("chat-name"), chatDesc: $("chat-desc"), banner: $("banner"), log: $("log"),
      composer: $("composer"), input: $("input"), send: $("send"), counter: $("counter"),
      stage: $("stage"), stageAvatar: $("stage-avatar"), stageStatus: $("stage-status"), voiceBtn: $("voice-btn"),
    };

    const state = {
      personas: [], maxTurns: 20, maxChars: 500,
      current: null, busy: false,
      // 相手ごとの会話。サーバーが正で、ここは表示用の写し / Per-persona copy for display; the server is the source of truth
      convs: {},
      // 相手の様子: idle（待っている）/ thinking（考えている）/ speaking（話している）/ What the persona is doing
      phase: "idle",
      // 文字を出している最中か（口を動かす） / Whether text is being revealed right now (moves the mouth)
      mouthMoving: false,
    };

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    // ---------- 相手の似顔絵 ----------
    // 架空の人物のイラスト。ここに無い相手（personas.json に足した人）は、共通の絵の色違いになる
    // Illustrations of fictional people. Personas not listed here get the shared drawing in another colour.
    const LOOKS = {
      "b-company": { bg: "#d8e5f5", hair: "#2a2522", jacket: "#2e3d55", shirt: "#ffffff", extra: "glasses", pitch: 0.95 },
      "cs": { bg: "#d9efe4", hair: "#5b3d2b", jacket: "#2d7a63", shirt: "#f5f2ea", extra: "headset", pitch: 1.1 },
    };
    const FALLBACK_LOOKS = [
      { bg: "#f4e4d4", hair: "#3a2a20", jacket: "#7b4c30", shirt: "#ffffff", extra: null, pitch: 1 },
      { bg: "#e7e1f4", hair: "#25222b", jacket: "#4b3f78", shirt: "#ffffff", extra: null, pitch: 1.05 },
    ];

    function lookFor(personaId) {
      if (LOOKS[personaId]) return LOOKS[personaId];
      const index = Math.max(0, state.personas.findIndex((p) => p.id === personaId));
      return FALLBACK_LOOKS[index % FALLBACK_LOOKS.length];
    }

    function avatarSvg(look) {
      const glasses = look.extra === "glasses"
        ? `<g fill="none" stroke="#2b2b2b" stroke-width="1.5"><rect x="36" y="42.5" width="12" height="9" rx="3.5"/><rect x="52" y="42.5" width="12" height="9" rx="3.5"/><path d="M48 46.5h4"/></g>`
        : "";
      const headset = look.extra === "headset"
        ? `<g fill="none" stroke="#33383f" stroke-linecap="round"><path d="M29.5 47C29.5 19 70.5 19 70.5 47" stroke-width="2.6"/><path d="M29 54c1.5 6 6.5 8.5 12 8" stroke-width="1.8"/></g>` +
          `<g fill="#33383f"><rect x="25.5" y="42" width="7" height="13" rx="3"/><rect x="67.5" y="42" width="7" height="13" rx="3"/><circle cx="42.5" cy="62" r="2.2"/></g>`
        : "";
      return `<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">` +
        `<rect width="100" height="100" fill="${look.bg}"/>` +
        `<path d="M14 104c0-21 16-33 36-33s36 12 36 33z" fill="${look.jacket}"/>` +
        `<rect x="43.5" y="59" width="13" height="14" rx="5" fill="#e6b592"/>` +
        `<path d="M42 71.5 50 83l8-11.5z" fill="${look.shirt}"/>` +
        `<circle cx="31.5" cy="48" r="4.2" fill="#efc29f"/><circle cx="68.5" cy="48" r="4.2" fill="#efc29f"/>` +
        `<ellipse cx="50" cy="46" rx="18.5" ry="20.5" fill="#f5cfad"/>` +
        `<path d="M31 47c-2.5-17 6.5-25.5 19-25.5S71.5 30 69 47c-1.5-6-3.5-9.5-6.5-11.5-7 3.5-17.5 3.5-25.5-1-3 2.5-5 6.5-6 12.5z" fill="${look.hair}"/>` +
        `<path d="M39 41.5q4-2.2 8 0M53 41.5q4-2.2 8 0" fill="none" stroke="${look.hair}" stroke-width="1.6" stroke-linecap="round"/>` +
        `<g class="eyes"><g class="gaze" fill="#2b2b2b"><circle cx="42" cy="47" r="1.9"/><circle cx="58" cy="47" r="1.9"/></g></g>` +
        `<circle cx="38.5" cy="53.5" r="2.6" fill="#f09a86" opacity=".35"/><circle cx="61.5" cy="53.5" r="2.6" fill="#f09a86" opacity=".35"/>` +
        `<path class="mouth-closed" d="M45.5 56.5q4.5 3.2 9 0" fill="none" stroke="#9c4a3c" stroke-width="1.7" stroke-linecap="round"/>` +
        `<ellipse class="mouth-open" cx="50" cy="57.5" rx="4" ry="3.2" fill="#8b3a2f"/>` +
        glasses + headset +
        `</svg>`;
    }

    // ---------- 相手の様子（待っている・考えている・話している） ----------
    function refreshStage() {
      const view = state.phase === "thinking" ? "thinking"
        : state.phase === "speaking" || speech.pending > 0 ? "speaking"
        : "idle";
      els.stage.dataset.state = view;
      els.stageStatus.textContent = { idle: "あなたの質問を待っています", thinking: "考えています", speaking: "話しています" }[view];
      // 声が出ているあいだは声に、それ以外は文字の表示に口を合わせる / The mouth follows the voice while it plays, otherwise the text
      const moving = speech.pending > 0 ? speech.talking : state.mouthMoving;
      els.stageAvatar.classList.toggle("talking", view === "speaking" && moving);
      els.stageAvatar.classList.toggle("thinking", view === "thinking");
    }

    // ---------- 返答を話す速さで見せる ----------
    // サーバーから届いた文字を、1秒に約28文字ずつ出す。句読点では少し間を置く。遅れが大きいときは約1.5秒で追いつく
    // Reveals streamed text at ~28 chars/s with short pauses at punctuation; when far behind it catches up within ~1.5 s
    const CHARS_PER_SECOND = 28;
    const PAUSE_MS = { "。": 300, "！": 300, "？": 300, "!": 300, "?": 300, "\n": 300, "、": 130, "，": 130, ",": 130 };

    function createTypewriter(bubble, onMouth) {
      let chars = [];
      let shown = 0;
      let budget = 0;
      let last = 0;
      let pauseUntil = 0;
      let timer = null;
      let complete = false;
      let resolveDone = null;

      const render = () => {
        if (shown === 0) return; // 最初の文字までは「…」のまま / Keep the dots until the first character
        bubble.textContent = chars.slice(0, shown).join("");
        els.log.scrollTop = els.log.scrollHeight;
      };
      const settle = () => {
        if (complete && shown >= chars.length && resolveDone) {
          bubble.classList.remove("live");
          resolveDone();
          resolveDone = null;
        }
      };
      const tick = () => {
        timer = null;
        const now = performance.now();
        if (now < pauseUntil) {
          last = now;
          onMouth(false);
          timer = setTimeout(tick, 30);
          return;
        }
        const backlog = chars.length - shown;
        if (backlog <= 0) {
          onMouth(false);
          settle();
          return; // 次の文字が届いたら push で再開 / push() restarts the loop
        }
        const catchingUp = backlog > CHARS_PER_SECOND * 1.5;
        const rate = catchingUp ? backlog / 1.5 : CHARS_PER_SECOND;
        budget += ((now - last) / 1000) * rate;
        last = now;
        while (budget >= 1 && shown < chars.length) {
          budget -= 1;
          const ch = chars[shown++];
          const isEnd = complete && shown === chars.length;
          if (!catchingUp && PAUSE_MS[ch] && !isEnd) {
            pauseUntil = now + PAUSE_MS[ch];
            budget = 0;
            break;
          }
        }
        render();
        onMouth(now >= pauseUntil);
        timer = setTimeout(tick, 30);
      };
      const start = () => {
        if (timer !== null) return;
        last = performance.now();
        timer = setTimeout(tick, 0);
      };

      return {
        push(text) {
          chars = Array.from(text);
          if (shown > chars.length) shown = chars.length;
          bubble.classList.add("live");
          if (reduceMotion.matches) {
            shown = chars.length;
            render();
            settle();
            return;
          }
          start();
        },
        reset() {
          chars = [];
          shown = 0;
          budget = 0;
          pauseUntil = 0;
          bubble.classList.remove("live");
        },
        // 全部出し終わったら解決する / Resolves once everything has been shown
        finish() {
          complete = true;
          return new Promise((resolve) => {
            resolveDone = resolve;
            if (reduceMotion.matches) shown = chars.length;
            render();
            if (shown >= chars.length) settle();
            else start();
          });
        },
        stop() {
          if (timer !== null) clearTimeout(timer);
          timer = null;
          bubble.classList.remove("live");
          onMouth(false);
          if (resolveDone) resolveDone();
          resolveDone = null;
        },
      };
    }

    // ---------- 読み上げ（ブラウザの機能。音声はサーバーに送らない） ----------
    // Read-aloud with the browser's built-in speech synthesis; nothing is sent to the server
    const speech = {
      supported: "speechSynthesis" in window && "SpeechSynthesisUtterance" in window,
      on: false,
      voices: [],
      gen: 0,        // やめたときに古い発話の通知を無視するための番号 / Bumped on stop so stale callbacks are ignored
      pending: 0,    // 話し終わっていない文の数 / Sentences queued and not yet finished
      queued: 0,     // 返答のうち、読み上げに回した文字数 / How much of the reply has been queued
      talking: false,
      watchdog: null,
      utterances: new Set(), // 参照を持っておかないと、途中で止まるブラウザがある / Keep references; some browsers drop them mid-speech
    };
    const VOICE_KEY = "hearing-simulator:voice";
    // macOS のおもしろ音声は除く / Skip macOS's novelty voices
    const NOVELTY_VOICES = /^(Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox)\b/;

    function loadVoices() {
      const kind = (voice) =>
        /Natural|Neural|Online/i.test(voice.name) ? 0
        : /Google/i.test(voice.name) ? 1
        : /Kyoko|Otoya|Hattori|O-ren|Haruka|Ayumi|Ichiro|Sayaka|Nanami|Keita/i.test(voice.name) ? 2
        : 3;
      // 同じ話者の高音質版があれば、そちらを先にする / Prefer the enhanced edition of the same speaker
      const rank = (voice) => kind(voice) * 2 + (/拡張|Enhanced|Premium/i.test(voice.name) ? 0 : 1);
      const speaker = (voice) => voice.name.replace(/[（(][^）)]*[）)]/g, "").trim();
      const seen = new Set();
      // 相手ごとに別の話者を割り当てたいので、同じ話者は1つだけ残す / Keep one voice per speaker so personas sound different
      speech.voices = speechSynthesis.getVoices()
        .filter((voice) => /^ja([-_]|$)/i.test(voice.lang) && !NOVELTY_VOICES.test(voice.name))
        .sort((a, b) => rank(a) - rank(b))
        .filter((voice) => !seen.has(speaker(voice)) && seen.add(speaker(voice)));
      // 日本語の声が無い環境では、ボタンを出さない / Hide the toggle when no Japanese voice exists
      els.voiceBtn.hidden = speech.voices.length === 0;
    }

    function setVoice(on) {
      speech.on = on;
      els.voiceBtn.setAttribute("aria-pressed", String(on));
      try { localStorage.setItem(VOICE_KEY, on ? "on" : "off"); } catch { /* 保存できなくても動く / Works without storage */ }
      if (!on) speakStop();
    }

    function speakStop() {
      speech.gen += 1;
      speech.pending = 0;
      speech.queued = 0;
      speech.talking = false;
      speech.utterances.clear();
      if (speech.watchdog !== null) clearInterval(speech.watchdog);
      speech.watchdog = null;
      if (speech.supported) speechSynthesis.cancel();
      refreshStage();
    }

    // 届いた返答のうち、文の終わりまでそろった分を順に読み上げる / Queue each complete sentence as it arrives
    function speakFeed(text, final, personaId) {
      if (!speech.on || speech.voices.length === 0) return;
      const rest = text.slice(speech.queued);
      const sentence = /[^。！？!?\n]*[。！？!?\n]+/gu;
      let used = 0;
      for (let match; (match = sentence.exec(rest)); ) {
        speakSentence(match[0], personaId);
        used = sentence.lastIndex;
      }
      speech.queued += used;
      if (final) {
        speakSentence(text.slice(speech.queued), personaId);
        speech.queued = text.length;
      }
    }

    function speakSentence(text, personaId) {
      const words = text.trim();
      if (!words) return;
      const utterance = new SpeechSynthesisUtterance(words);
      // 相手ごとに別の声にする（声が1つしか無ければ高さだけ変える） / A different voice per persona when available
      const index = Math.max(0, state.personas.findIndex((p) => p.id === personaId));
      utterance.voice = speech.voices[index % speech.voices.length];
      utterance.lang = utterance.voice.lang;
      utterance.pitch = lookFor(personaId).pitch;
      utterance.rate = 1.1;
      const gen = speech.gen;
      const end = () => {
        speech.utterances.delete(utterance);
        if (gen !== speech.gen) return;
        speech.pending = Math.max(0, speech.pending - 1);
        if (speech.pending === 0) speech.talking = false;
        refreshStage();
      };
      utterance.onstart = () => {
        if (gen !== speech.gen) return;
        speech.talking = true;
        refreshStage();
      };
      utterance.onend = end;
      utterance.onerror = end;
      speech.pending += 1;
      speech.utterances.add(utterance);
      speechSynthesis.speak(utterance);
      // 音が出せない環境では終わりの通知が来ないことがあるので、実際に止まっていたら片付ける
      // Some environments never fire onend (e.g. no audio device); clean up once synthesis has actually stopped
      if (speech.watchdog === null) {
        speech.watchdog = setInterval(() => {
          if (speech.pending > 0 && !speechSynthesis.speaking && !speechSynthesis.pending) {
            speech.pending = 0;
            speech.talking = false;
            refreshStage();
          }
          if (speech.pending === 0) {
            clearInterval(speech.watchdog);
            speech.watchdog = null;
          }
        }, 1000);
      }
      refreshStage();
    }

    const codePoints = (text) => Array.from(text).length;

    async function api(path, options = {}) {
      const res = await fetch(path, {
        ...options,
        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
      });
      return res;
    }

    async function errorMessage(res) {
      try {
        const data = await res.json();
        return data && data.error && data.error.message ? data.error.message : "エラーが発生しました。もう一度試してください";
      } catch {
        return "エラーが発生しました。もう一度試してください";
      }
    }

    // ---------- 画面の切り替え ----------
    function showLogin(message) {
      els.appView.hidden = true;
      els.who.hidden = true;
      els.loginView.hidden = false;
      els.loginError.hidden = !message;
      els.loginError.textContent = message || "";
      els.code.focus();
    }

    async function showApp(name) {
      els.loginView.hidden = true;
      els.appView.hidden = false;
      els.who.hidden = false;
      els.whoName.textContent = name;

      const res = await api("/api/personas");
      if (res.status === 401) return showLogin();
      if (!res.ok) return showLogin(await errorMessage(res));
      const data = await res.json();
      state.personas = data.personas;
      state.maxTurns = data.maxTurns;
      state.maxChars = data.maxMessageChars;

      await Promise.all(state.personas.map((p) => loadHistory(p.id)));
      renderPersonas();
      selectPersona(state.current && state.personas.some((p) => p.id === state.current) ? state.current : state.personas[0].id);
    }

    async function loadHistory(personaId) {
      const res = await api(`/api/chat/${encodeURIComponent(personaId)}`);
      if (res.status === 401) return showLogin();
      if (!res.ok) return;
      const data = await res.json();
      state.convs[personaId] = { messages: data.messages, remaining: data.remaining };
    }

    // ---------- 描画 ----------
    function renderPersonas() {
      els.personas.textContent = "";
      for (const persona of state.personas) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "persona-btn";
        button.setAttribute("role", "tab");
        button.dataset.id = persona.id;
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = persona.name;
        const desc = document.createElement("span");
        desc.className = "desc";
        desc.textContent = persona.description;
        button.append(name, desc);
        button.addEventListener("click", () => selectPersona(persona.id));
        els.personas.append(button);
      }
    }

    function currentPersona() {
      return state.personas.find((p) => p.id === state.current);
    }

    function selectPersona(id) {
      if (state.busy) return;
      state.current = id;
      for (const button of els.personas.children) {
        button.setAttribute("aria-selected", String(button.dataset.id === id));
      }
      const persona = currentPersona();
      els.chatName.textContent = persona.name;
      els.chatDesc.textContent = persona.description;
      els.stageAvatar.innerHTML = avatarSvg(lookFor(id));
      els.exportBtn.href = `/api/chat/${encodeURIComponent(id)}/export`;
      speakStop();
      hideBanner();
      renderMessages();
      renderRemaining();
      els.input.focus();
    }

    function addMessageEl(role, text, pending) {
      const wrap = document.createElement("div");
      wrap.className = `msg ${role}`;
      if (role !== "user") {
        const avatar = document.createElement("div");
        avatar.className = "msg-avatar avatar";
        avatar.setAttribute("aria-hidden", "true");
        avatar.innerHTML = avatarSvg(lookFor(state.current));
        wrap.append(avatar);
      }
      const body = document.createElement("div");
      body.className = "msg-body";
      const label = document.createElement("div");
      label.className = "who-label";
      label.textContent = role === "user" ? "あなた" : currentPersona().name;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if (pending && !text) bubble.append(typingDots());
      else bubble.textContent = text;
      body.append(label, bubble);
      wrap.append(body);
      els.log.append(wrap);
      els.log.scrollTop = els.log.scrollHeight;
      return bubble;
    }

    function typingDots() {
      const dots = document.createElement("span");
      dots.className = "typing";
      dots.setAttribute("aria-label", "返答を作成中");
      dots.append(document.createElement("i"), document.createElement("i"), document.createElement("i"));
      return dots;
    }

    function renderMessages() {
      els.log.textContent = "";
      const conv = state.convs[state.current];
      if (!conv || conv.messages.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = `${currentPersona().name}に、資料に書かれていないことを質問してみましょう。`;
        els.log.append(empty);
        return;
      }
      for (const message of conv.messages) addMessageEl(message.role, message.text, false);
    }

    function renderRemaining() {
      const conv = state.convs[state.current];
      const remaining = conv ? conv.remaining : state.maxTurns;
      els.remaining.textContent = remaining > 0 ? `残り：${remaining}回` : "上限に達しました";
      els.remaining.className = `remaining${remaining === 0 ? " none" : remaining <= 5 ? " low" : ""}`;
      updateControls();
    }

    function updateControls() {
      const conv = state.convs[state.current];
      const remaining = conv ? conv.remaining : state.maxTurns;
      const length = codePoints(els.input.value.trim());
      const tooLong = length > state.maxChars;
      els.counter.textContent = `${length} / ${state.maxChars}`;
      els.counter.classList.toggle("over", tooLong);
      els.send.disabled = state.busy || remaining === 0 || length === 0 || tooLong;
      els.input.disabled = state.busy || remaining === 0;
      els.input.placeholder = remaining === 0
        ? "この相手との往復の上限に達しました。「やり直す」で最初から始められます"
        : "質問を入力（Enterで送信、Shift+Enterで改行）";
      els.resetBtn.disabled = state.busy;
      for (const button of els.personas.children) button.disabled = state.busy;
      const hasMessages = Boolean(conv && conv.messages.length > 0);
      els.exportBtn.setAttribute("aria-disabled", String(!hasMessages || state.busy));
    }

    function showBanner(message) {
      els.banner.textContent = message;
      els.banner.hidden = false;
    }
    function hideBanner() {
      els.banner.hidden = true;
      els.banner.textContent = "";
    }

    // ---------- 送信（SSEを読む） ----------
    async function sendMessage() {
      const text = els.input.value.trim();
      const personaId = state.current;
      if (!text || state.busy) return;

      hideBanner();
      speakStop();
      state.busy = true;
      state.phase = "thinking";
      updateControls();
      refreshStage();

      // 初回は案内文を消す / drop the empty-state hint on first message
      const empty = els.log.querySelector(".empty");
      if (empty) empty.remove();
      addMessageEl("user", text, false);
      const bubble = addMessageEl("assistant", "", true);
      const typewriter = createTypewriter(bubble, (moving) => {
        if (state.mouthMoving === moving) return;
        state.mouthMoving = moving;
        refreshStage();
      });
      let streamed = "";
      let finished = false;
      // 文字を少しずつ出すあいだ、読み上げソフトには出し終わってから伝える / Let screen readers wait until the reveal is done
      els.log.setAttribute("aria-busy", "true");

      try {
        const res = await api(`/api/chat/${encodeURIComponent(personaId)}`, {
          method: "POST",
          body: JSON.stringify({ message: text }),
        });

        if (res.status === 401) {
          showLogin("接続が切れました。もう一度、合言葉と名前を入力してください。");
          return;
        }
        const type = res.headers.get("content-type") || "";
        if (!res.ok || !type.includes("text/event-stream")) {
          throw new Error(await errorMessage(res));
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        const handle = (event, data) => {
          if (event === "delta") {
            streamed += data.text;
            state.phase = "speaking";
            typewriter.push(streamed);
            speakFeed(streamed, false, personaId);
            refreshStage();
          } else if (event === "reset") {
            // サーバーが別のAIで最初から作り直した / The server restarted the reply (e.g. on a fallback model)
            streamed = "";
            typewriter.reset();
            speakStop();
            bubble.textContent = "";
            bubble.append(typingDots());
            state.phase = "thinking";
            refreshStage();
          } else if (event === "done") {
            finished = true;
            state.phase = "speaking";
            typewriter.push(data.text);
            speakFeed(data.text, true, personaId);
            refreshStage();
            const conv = state.convs[personaId] || { messages: [], remaining: state.maxTurns };
            conv.messages.push({ role: "user", text }, { role: "assistant", text: data.text });
            conv.remaining = data.remaining;
            state.convs[personaId] = conv;
            els.input.value = "";
            els.input.style.height = "auto";
          } else if (event === "error") {
            throw new Error(data.message);
          }
        };

        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let boundary;
          while ((boundary = buffer.indexOf("\n\n")) !== -1) {
            const block = buffer.slice(0, boundary);
            buffer = buffer.slice(boundary + 2);
            const eventLine = block.split("\n").find((line) => line.startsWith("event:"));
            const dataLine = block.split("\n").find((line) => line.startsWith("data:"));
            if (!eventLine || !dataLine) continue;
            handle(eventLine.slice(6).trim(), JSON.parse(dataLine.slice(5).trim()));
          }
        }
        if (!finished) throw new Error("通信が途切れました。もう一度送ってください");
        // 話し終わるまで待つ（遅れていても約1.5秒で追いつく） / Wait until the reply has been fully shown
        await typewriter.finish();
      } catch (error) {
        // 失敗した発言は履歴に残らない。入力欄へ戻して、サーバーの状態に表示を合わせる
        // A failed message is not persisted: put it back in the box and re-sync the view with the server
        typewriter.stop();
        speakStop();
        showBanner(error instanceof Error ? error.message : "エラーが発生しました。もう一度送ってください");
        await loadHistory(personaId);
      } finally {
        state.busy = false;
        state.phase = "idle";
        state.mouthMoving = false;
        els.log.removeAttribute("aria-busy");
        if (state.current === personaId) {
          renderMessages();
          renderRemaining();
          els.input.focus();
        }
        updateControls();
        refreshStage();
      }
    }

    // ---------- 操作 ----------
    els.loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      els.loginSubmit.disabled = true;
      els.loginError.hidden = true;
      try {
        const res = await api("/api/session", {
          method: "POST",
          body: JSON.stringify({ code: els.code.value, name: els.name.value }),
        });
        if (!res.ok) {
          els.loginError.textContent = await errorMessage(res);
          els.loginError.hidden = false;
          return;
        }
        const data = await res.json();
        els.code.value = "";
        await showApp(data.name);
      } catch {
        els.loginError.textContent = "通信に失敗しました。もう一度試してください";
        els.loginError.hidden = false;
      } finally {
        els.loginSubmit.disabled = false;
      }
    });

    els.composer.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage();
    });

    els.input.addEventListener("input", () => {
      updateControls();
      els.input.style.height = "auto";
      els.input.style.height = `${Math.min(els.input.scrollHeight, 160)}px`;
    });

    els.input.addEventListener("keydown", (event) => {
      // 日本語入力の変換確定のEnterでは送信しない / Do not send on the Enter that confirms IME composition
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing && event.keyCode !== 229) {
        event.preventDefault();
        if (!els.send.disabled) sendMessage();
      }
    });

    els.resetBtn.addEventListener("click", async () => {
      const persona = currentPersona();
      if (!persona || state.busy) return;
      if (!window.confirm(`「${persona.name}」との会話を最初からやり直しますか？\nこれまでの会話は画面から消えます（講師の記録には残ります）。`)) return;
      const res = await api(`/api/chat/${encodeURIComponent(persona.id)}/reset`, { method: "POST", body: "{}" });
      if (res.status === 401) return showLogin();
      if (!res.ok) return showBanner(await errorMessage(res));
      const data = await res.json();
      state.convs[persona.id] = { messages: [], remaining: data.remaining };
      speakStop();
      hideBanner();
      renderMessages();
      renderRemaining();
    });

    els.exportBtn.addEventListener("click", (event) => {
      if (els.exportBtn.getAttribute("aria-disabled") === "true") event.preventDefault();
    });

    els.voiceBtn.addEventListener("click", () => setVoice(!speech.on));

    // 読み上げは既定でオフ。前回オンにしていたら引き継ぐ / Read-aloud is off by default; remember the last choice
    if (speech.supported) {
      try { speech.on = localStorage.getItem(VOICE_KEY) === "on"; } catch { speech.on = false; }
      els.voiceBtn.setAttribute("aria-pressed", String(speech.on));
      loadVoices();
      // 声の一覧は後から届くことがある / The voice list can arrive later
      speechSynthesis.addEventListener("voiceschanged", loadVoices);
    }

    // ---------- 起動 ----------
    (async function init() {
      try {
        const res = await api("/api/session");
        if (res.ok) {
          const data = await res.json();
          await showApp(data.name);
        } else {
          showLogin();
        }
      } catch {
        showLogin("通信に失敗しました。ページを開き直してください");
      }
    })();
  </script>
</body>
</html>
